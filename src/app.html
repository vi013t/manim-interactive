<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/logo.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link href="https://fonts.cdnfonts.com/css/cmu-serif" rel="stylesheet" />

		<style>
			* {
				padding: 0px;
				margin: 0px;
				box-sizing: border-box;
				border: none;
				outline: none;
				background: transparent;
				font-weight: normal;
				font-family: Segoe UI;
				-ms-overflow-style: none;
				scrollbar-width: none;
				color: inherit;

				--mauve: #cba6f7;
				--red: #f38ba8;
				--peach: #fab387;
				--yellow: #f9e2af;
				--green: #a6e3a1;
				--teal: #94e2d5;
				--blue: #89b4fa;
				--lavender: #b4befe;
				--text: #cdd6f4;
				--subtext-0: #a6adc8;
				--overlay-2: #9399b2;
				--overlay-0: #6c7086;
				--surface-2: #585b70;
				--surface-0: #313244;
				--base: #1e1e2e;
				--mantle: #181825;
				--crust: #11111b;

				&::-webkit-scrollbar {
					display: none;
				}
			}
			html,
			body,
			main {
				overflow: hidden;
			}

			html, body {
				height: 100%;
				width: 100%;
			}

			button,
			label,
			select,
			option {
				cursor: pointer;
			}

			*:not(*[contenteditable]) {
				user-select: none;
			}

			span {
				display: flex;
				align-items: center;
			}
		</style>

		<title>Manim Interactive</title>
		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
