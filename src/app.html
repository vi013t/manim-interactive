<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/logo.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link href="https://fonts.cdnfonts.com/css/cmu-serif" rel="stylesheet" />

		<style>
			* {
				padding: 0px;
				margin: 0px;
				box-sizing: border-box;
				border: none;
				outline: none;
				background: transparent;
				font-weight: normal;
				font-family: Segoe UI;
				-ms-overflow-style: none;
				scrollbar-width: none;

				&::-webkit-scrollbar {
					display: none;
				}
			}

			html {
				width: 100vw;
				height: 100vh;
			}

			html,
			body,
			main {
				overflow: hidden;
			}

			body {
				height: 100%;
				width: 100%;
			}

			button,
			label,
			select,
			option {
				cursor: pointer;
			}

			*:not(*[contenteditable]) {
				user-select: none;
			}

			span {
				display: flex;
				align-items: center;
			}
		</style>

		<title>Manim Interactive</title>
		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
